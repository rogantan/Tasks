services:
  app:
    container_name: task_backend
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    restart: always
    command: poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - postgres
      - redis
    env_file:
      - ../.env
    ports:
      - "14325:8000"

  postgres:
    image: postgres:14
    restart: always
    env_file:
      - ../.env
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  
  redis:
    image: redis
    restart: always
    env_file:
      - ../.env
    volumes:
      - ./redisdata:/data
    ports:
      - "6380:6379"

volumes:
  db_data:
